name: Test and Release 
on:
  push:
    branches: [ main ]
  
jobs:
  Quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Configure uv & Install dependencies
      run: |
       python -m pip install --upgrade pip
       pip install uv && uv sync --all-extras
    
    - name: View uv version
      run: uv --version
    
    - name: Lint with ruff
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run ruff check --select=E9,F63,F7,F82 --output-format=full --statistics
        # Run full ruff linting
        uv run ruff check --statistics
    
    - name: Check formatting with ruff
      run: |
        uv run ruff format --check
    
    - name: Security Analysis with bandit
      run: |
        # stop pipeline if level 3 vulnerability found
        uv run bandit -r -lll ./openodia ./tests
    - name: Test with pytest
      run: |
        uv run python -m pytest -v tests
    
  Release:
    needs: Quality
    # https://github.community/t/how-do-i-specify-job-dependency-running-in-another-workflow/16482
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push the tag and create the GitHub release
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Read the version being released
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build package
        run: uv build
      # --check-url skips files already on PyPI, but the simple index is CDN-cached
      # and can still be stale seconds after an upload, so a concurrent run racing
      # this one would try to re-upload and fail. Re-publishing a version that is
      # already there is a no-op, not an error; anything else still fails the job.
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if output=$(uv publish --check-url https://pypi.org/simple/ 2>&1); then
            echo "$output"
            exit 0
          fi
          echo "$output"
          if grep -q 'File already exists' <<<"$output"; then
            echo "::notice::${VERSION} is already on PyPI; nothing to upload."
            exit 0
          fi
          exit 1
      # Tags are unprefixed here to match the existing ones (0.1.11, 0.1.12).
      # --target pins the tag to the commit that was actually built; without it
      # `gh release create` tags whatever the default branch points at when the
      # call lands, which is a different commit if another merge slipped in.
      - name: Tag the release and publish notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists, nothing to do."
            exit 0
          fi
          gh release create "${VERSION}" dist/* \
            --title "${VERSION}" \
            --target "${GITHUB_SHA}" \
            --generate-notes
